<!doctype html>
<html lang="en">

<head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Site Information -->
    <title>Autism Predictor - Gene Expression Analysis Tool</title>
    <meta name="description"
        content="An evidence-based prediction tool using artificial neural networks trained on gene expression data to support autism spectrum characterization. For research and educational purposes." />
    <meta name="keywords" content="autism, gene expression, prediction, neural network, ASD, neurodevelopmental" />
    <meta name="author" content="Autism Prediction Research Team" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Autism Predictor - Gene Expression Analysis Tool" />
    <meta property="og:description" content="Evidence-based prediction tool for autism characterization" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Theme & Styling -->
    <meta name="theme-color" content="#4a9b8e" />
    <meta name="color-scheme" content="light" />

    <!-- Accessibility -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Autism Predictor" />

    <!-- Security -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Preconnect to External Resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="http://127.0.0.1:5000" />

    <!-- Skip to Main Content Link (Accessibility) -->
    <style>
        .skip-to-main {
            position: absolute;
            top: -40px;
            left: 0;
            background: #4a9b8e;
            color: white;
            padding: 8px;
            z-index: 100;
        }

        .skip-to-main:focus {
            top: 0;
        }
    </style>
</head>

<body>
    <a href="#main-content" class="skip-to-main">Skip to main content</a>
    <div id="root" role="application"></div>
    <main id="main-content" />
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
